name: Android APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot and templates
        run: |
          set -eux
          VER=4.4.1
          BASE="https://github.com/godotengine/godot/releases/download/${VER}-stable"
          curl -fL --retry 3 "$BASE/Godot_v${VER}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${VER}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${VER}-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${VER}.stable"
          unzip -q -j templates.tpz 'templates/*' -d "$HOME/.local/share/godot/export_templates/${VER}.stable"
      - name: Import project
        run: godot --headless --editor --path . --import --quit
      - name: Test project startup
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 --verbose 2>&1 | tee smoke.log
          if grep -E '(SCRIPT ERROR|Parse Error|ERROR: Cannot)' smoke.log; then exit 1; fi
      - name: Create Android signing configuration
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug Android builds/HotelHaven-debug.apk
          test -s builds/HotelHaven-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HotelHaven-Android-APK
          path: builds/HotelHaven-debug.apk
          if-no-files-found: error
